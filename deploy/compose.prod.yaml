name: finance

services:
  finance:
    build:
      context: ..
      dockerfile: Dockerfile
    image: finance:local
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.35
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - /opt/data/finance/settings.env
    environment:
      # Finance reaches fixed, read-only module paths through Caddy on its
      # existing isolated edge network. It deliberately does not join the
      # shared app network, which would expose its header-authenticated APIs
      # to unrelated containers.
      ATHLETICS_MCP_BASE_URL: http://caddy:8088
      BOOKS_MCP_BASE_URL: http://caddy:8088
      BOOKS_MCP_OWNER: ggouger
      MCP_MODULE_INTERNAL: "1"
    volumes:
      - /opt/data/finance/data:/data
      - /opt/data/finance/backups:/backups
      - /opt/data/finance/release-gates.json:/run/finance/release-gates.json:ro
      - /opt/data/finance/secrets/plaid-credentials.fernet:/run/secrets/plaid-credentials.fernet:ro
      - /opt/data/finance/keys/plaid-credentials.key:/run/secrets/plaid-credentials.key:ro
      - /opt/data/finance/secrets/rentcast-credentials.fernet:/run/secrets/rentcast-credentials.fernet:ro
      - /opt/data/finance/keys/rentcast-credentials.key:/run/secrets/rentcast-credentials.key:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    expose:
      - "8080"
    networks:
      finance_edge:
        aliases:
          - finance

networks:
  finance_edge:
    external: true
    name: finance_edge
