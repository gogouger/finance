name: finance

services:
  finance:
    build:
      context: ..
      dockerfile: Dockerfile
    image: finance:local
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.35
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - /opt/data/finance/settings.env
    environment:
      # Fixed internal, read-only module addresses used by the central MCP
      # gateway. They are deliberately not supplied by MCP tool arguments.
      ATHLETICS_MCP_BASE_URL: http://meron:8050
      BOOKS_MCP_BASE_URL: http://books-api:80
      BOOKS_MCP_OWNER: gordon
    volumes:
      - /opt/data/finance/data:/data
      - /opt/data/finance/backups:/backups
      - /opt/data/finance/release-gates.json:/run/finance/release-gates.json:ro
      - /opt/data/finance/secrets/plaid-credentials.fernet:/run/secrets/plaid-credentials.fernet:ro
      - /opt/data/finance/keys/plaid-credentials.key:/run/secrets/plaid-credentials.key:ro
      - /opt/data/finance/secrets/rentcast-credentials.fernet:/run/secrets/rentcast-credentials.fernet:ro
      - /opt/data/finance/keys/rentcast-credentials.key:/run/secrets/rentcast-credentials.key:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    expose:
      - "8080"
    networks:
      finance_edge:
        aliases:
          - finance
      personal_apps: {}

networks:
  finance_edge:
    external: true
    name: finance_edge
  # The Finance gateway may make fixed, read-only requests to the Athletic
  # Analytics and Library containers. This is the existing private app
  # network; Caddy remains the only service exposing Finance publicly.
  personal_apps:
    external: true
    name: ggouger_default
