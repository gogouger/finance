name: finance

services:
  finance-oidc-bridge:
    image: finance:local
    restart: unless-stopped
    command:
      - uvicorn
      - backend.finance_auth_bridge.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      - --no-server-header
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.20
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - /opt/data/finance/oidc-bridge.env
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m
    expose:
      - "8081"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      finance_edge:
        aliases:
          - finance-oidc-bridge

networks:
  finance_edge:
    external: true
    name: finance_edge
